<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Меню кофейни «Кофейный котик» — авторский кофе, десерты и фирменные напитки в Москве.">
<title>Наше меню — Кофейный котик</title>
<style>
    /* ===== Базовые стили ===== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
    }

    body {
        font-family: 'Georgia', 'Times New Roman', serif;
        background-color: #faf3e7;
        color: #3c2415;
        line-height: 1.6;
        overflow-x: hidden;
    }

    :root {
        --beige: #f5ebe0;
        --cream: #faf3e7;
        --brown: #6f4e37;
        --dark-brown: #3c2415;
        --caramel: #d4a574;
        --light-caramel: #e8c9a0;
        --white: #fffdf9;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    img {
        max-width: 100%;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    h2 {
        font-size: 2.5rem;
        color: var(--dark-brown);
        text-align: center;
        margin-bottom: 50px;
        position: relative;
    }

    h2::after {
        content: "☕";
        display: block;
        font-size: 1.5rem;
        margin-top: 10px;
    }

    /* ===== Навигация ===== */
    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: rgba(250, 243, 231, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 15px rgba(60, 36, 21, 0.1);
        z-index: 1000;
        transition: all 0.3s ease;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .logo {
        font-size: 1.6rem;
        font-weight: bold;
        color: var(--dark-brown);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logo span {
        font-size: 1.8rem;
    }

    .nav-links {
        display: flex;
        list-style: none;
        gap: 30px;
    }

    .nav-links a {
        color: var(--brown);
        font-size: 1rem;
        font-weight: 600;
        position: relative;
        transition: color 0.3s ease;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 2px;
        background-color: var(--caramel);
        transition: width 0.3s ease;
    }

    .nav-links a:hover {
        color: var(--caramel);
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    .burger {
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        background: none;
        border: none;
    }

    .burger span {
        width: 28px;
        height: 3px;
        background-color: var(--dark-brown);
        border-radius: 3px;
        transition: all 0.3s ease;
    }

    /* ===== Улучшение доступности (a11y): видимый фокус для клавиатуры ===== */
    .nav-links a:focus-visible,
    .btn:focus-visible,
    .burger:focus-visible,
    footer .socials a:focus-visible {
        outline: 3px solid var(--caramel);
        outline-offset: 4px;
        border-radius: 4px;
    }

    .nav-links a:focus,
    .btn:focus,
    .burger:focus,
    footer .socials a:focus {
        outline: none;
    }

    /* ===== Центральный блок «Наше меню» ===== */
    .menu-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: linear-gradient(135deg, #f5ebe0 0%, #e8c9a0 100%);
        padding-top: 80px;
        position: relative;
        overflow: hidden;
    }

    .menu-page::before {
        content: "🐾";
        position: absolute;
        font-size: 20rem;
        opacity: 0.05;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .menu-page .container {
        position: relative;
        z-index: 1;
    }

    .btn {
        display: inline-block;
        background-color: var(--caramel);
        color: var(--white);
        padding: 15px 40px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(212, 165, 116, 0.4);
    }

    .btn:hover {
        background-color: var(--brown);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(111, 78, 55, 0.4);
    }

    /* ===== Footer ===== */
    footer {
        background-color: var(--dark-brown);
        color: var(--beige);
        text-align: center;
        padding: 30px 20px;
    }

    footer p {
        margin-bottom: 10px;
    }

    footer .socials {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
    }

    footer .socials a {
        font-size: 1.8rem;
        transition: transform 0.3s ease;
        display: inline-block;
    }

    footer .socials a:hover {
        transform: scale(1.3) rotate(10deg);
    }

    /* ===== Адаптивность ===== */
    @media (max-width: 768px) {
        .nav-links {
            position: fixed;
            top: 70px;
            right: -100%;
            flex-direction: column;
            background-color: var(--cream);
            width: 80%;
            height: calc(100vh - 70px);
            padding: 40px 20px;
            gap: 25px;
            transition: right 0.4s ease;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.1);
        }

        .nav-links.active {
            right: 0;
        }

        .burger {
            display: flex;
        }

        .burger.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        .burger.active span:nth-child(2) {
            opacity: 0;
        }
        .burger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        h2 {
            font-size: 2rem;
        }
    }

    @media (max-width: 480px) {
        .btn {
            padding: 12px 30px;
            font-size: 1rem;
        }
    }
</style>
</head>
<body>

<!-- ===== Навигация ===== -->
<header>
    <nav>
        <div class="logo">
            <span>🐱</span> Кофейный котик
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#home">Главная</a></li>
            <li><a href="index.html#about">О нас</a></li>
            <li><a href="menu.html">Меню</a></li>
            <li><a href="index.html#promos">Акции</a></li>
            <li><a href="index.html#bonus">Бонусы</a></li>
            <li><a href="index.html#contacts">Контакты</a></li>
        </ul>
        <button class="burger" id="burger" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>
</header>

<!-- ===== Наше меню ===== -->
<section class="menu-page">
    <div class="container">
        <h2>Наше меню</h2>
        <a href="index.html" class="btn">На главную</a>
    </div>
</section>

<!-- ===== Footer ===== -->
<footer>
    <p><strong>🐱 Кофейный котик</strong> — Мурчим от счастья с каждой чашкой</p>
    <p>© 2026 Все права защищены. Сделано с любовью и кофе ☕</p>
    <div class="socials">
        <a href="#" aria-label="Instagram"><span aria-hidden="true">📷</span></a>
        <a href="#" aria-label="Telegram"><span aria-hidden="true">✈️</span></a>
        <a href="#" aria-label="VK"><span aria-hidden="true">💬</span></a>
        <a href="#" aria-label="WhatsApp"><span aria-hidden="true">💚</span></a>
    </div>
</footer>

<script>
    // Мобильное меню
    const burger = document.getElementById('burger');
    const navLinks = document.getElementById('navLinks');

    burger.addEventListener('click', () => {
        burger.classList.toggle('active');
        navLinks.classList.toggle('active');
    });

    // Закрытие меню при клике на ссылку
    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            burger.classList.remove('active');
            navLinks.classList.remove('active');
        });
    });

    // Эффект тени у шапки при прокрутке
    window.addEventListener('scroll', () => {
        const header = document.querySelector('header');
        if (window.scrollY > 50) {
            header.style.boxShadow = '0 4px 20px rgba(60, 36, 21, 0.15)';
        } else {
            header.style.boxShadow = '0 2px 15px rgba(60, 36, 21, 0.1)';
        }
    });
</script>

</body>
</html>
